<meta charset="utf-8">
<title>Dinner Banner Receipt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --table: #d8d7d2;
    --paper: #fbfaf6;
    --ink: #161616;
    --font: "Wix Madefor Display", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --table: #1b1b1a; }
  }
  :root[data-theme="dark"] { --table: #1b1b1a; }

  html, body { background: var(--table); margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    justify-items: center;
    align-items: start;
    padding: 40px 16px 64px;
    box-sizing: border-box;
  }

  .roll {
    width: min(100%, 380px);
    container-type: inline-size;
    filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .18)) drop-shadow(0 2px 3px rgba(0, 0, 0, .12));
  }
  .receipt {
    --z: 3.2cqw;
    padding: calc(var(--z) + 7cqw) 6cqw calc(var(--z) + 9cqw);
    background:
      linear-gradient(90deg, rgba(0, 0, 0, .035), transparent 6%, transparent 94%, rgba(0, 0, 0, .035)),
      var(--paper);
    color: var(--ink);
    font: 600 4.2cqw/1.4 var(--font);
    font-variant-numeric: tabular-nums;
    text-transform: uppercase;
    letter-spacing: .02em;
    -webkit-mask:
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--z) 51% repeat-x,
      conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--z) 51% repeat-x;
    mask:
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--z) 51% repeat-x,
      conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--z) 51% repeat-x;
  }
  .receipt p { margin: 0; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  /* banner-printer letters: each glyph stretched to the full paper width */
  .giant {
    display: block;
    width: 100%;
    margin: 5cqw 0;
  }

  .bar {
    height: 3cqw;
    margin: 6cqw 0;
    background: var(--ink);
  }

  .huge {
    font-size: 30cqw;
    font-weight: 800;
    line-height: .9;
    letter-spacing: -.04em;
    margin-left: -.06em;
  }
  .label {
    font-size: 3.3cqw;
    letter-spacing: .2em;
  }

  /* names run down the strip, one column per artist */
  .names {
    display: flex;
    justify-content: space-between;
    margin-top: 5cqw;
  }
  .names p {
    writing-mode: vertical-rl;
    font-size: 13cqw;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  .venue {
    font-size: 7.2cqw;
    font-weight: 800;
    line-height: 1.1;
  }

  @media print {
    @page { margin: 0; }
    html, body { background: #fff; }
    body { display: block; min-height: 0; padding: 0; }
    .roll { width: 72mm; margin: 0 auto; filter: none; }
    .receipt { background: #fff; color: #000; -webkit-mask: none; mask: none; padding-block: 6mm 10mm; }
  }
</style>

<main class="roll">
  <article class="receipt" aria-label="Colorblock × DNA Dinner, 10 October 2026">
    <div class="row"><span>Colorblock</span><span>×</span><span>DNA</span></div>

    <svg class="giant" viewBox="0 0 100 504" role="img" aria-label="Dinner">
      <g fill="currentColor" font-family="'Wix Madefor Display', sans-serif" font-weight="800" font-size="100">
        <text x="0" y="74" textLength="100" lengthAdjust="spacingAndGlyphs">D</text>
        <text x="50" y="160" text-anchor="middle">I</text>
        <text x="0" y="246" textLength="100" lengthAdjust="spacingAndGlyphs">N</text>
        <text x="0" y="332" textLength="100" lengthAdjust="spacingAndGlyphs">N</text>
        <text x="0" y="418" textLength="100" lengthAdjust="spacingAndGlyphs">E</text>
        <text x="0" y="504" textLength="100" lengthAdjust="spacingAndGlyphs">R</text>
      </g>
    </svg>

    <div class="bar"></div>

    <p class="label">Saturday</p>
    <p class="huge">10.10</p>
    <p class="label">Start</p>
    <p class="huge">18:00</p>

    <div class="bar"></div>

    <p class="label">Line-up</p>
    <div class="names">
      <p>Tanya Andrianova</p>
      <p>Igor Zotov</p>
      <p>Andrey Lee</p>
      <p>Sasha Chernikov</p>
      <p>Sophia Zhuravkova</p>
    </div>

    <div class="bar"></div>

    <p class="label">Venue</p>
    <p class="venue">DNA Kitchen<br>Samokatnaya 4s53</p>

    <div class="bar"></div>

    <div class="row"><span>10 Oct 2026</span><span>No. 0001</span></div>
  </article>
</main>
