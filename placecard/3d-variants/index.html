<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* Layout: the table fills the screen; a narrow lemon-edged index on the left, the assembly timeline along the bottom. */
:root {
  --scene: #d3cfc6;
  --table: #b9b3a7;
  --panel: rgba(250, 248, 242, .94);
  --ink: #141310;
  --muted: #6b675d;
  --line: rgba(20, 19, 16, .14);
  --lemon: #feed95;
  --lemon-ink: #141310;
  --display: 'Wix Madefor Display', 'Wix Madefor Text', system-ui, sans-serif;
  --text: 'Wix Madefor Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gap: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --scene: #2a2925; --table: #57534b; --panel: rgba(28, 27, 24, .92); --ink: #f2efe6; --muted: #a39f93; --line: rgba(242, 239, 230, .16); color-scheme: dark; }
}
:root[data-theme="dark"] { --scene: #2a2925; --table: #57534b; --panel: rgba(28, 27, 24, .92); --ink: #f2efe6; --muted: #a39f93; --line: rgba(242, 239, 230, .16); color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--scene); color: var(--ink); font-family: var(--text); font-size: 14px; overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#index { position: fixed; left: var(--gap); top: calc(var(--gap) + env(safe-area-inset-top, 0px)); width: 300px; max-height: calc(100% - 150px - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; overflow: hidden; border-left: 6px solid var(--lemon); }
#index header { padding: 14px 16px 10px; display: grid; gap: 2px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; text-wrap: balance; }
#sets { display: flex; gap: 4px; padding: 0 12px 10px; flex-wrap: wrap; }
#sets button, #artists button, #views button { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
#sets button[aria-pressed="true"], #artists button[aria-pressed="true"], #views button[aria-pressed="true"] { background: var(--lemon); color: var(--lemon-ink); border-color: var(--lemon); }
#designs { list-style: none; margin: 0; padding: 0 8px 8px; overflow: auto; display: grid; gap: 2px; }
#designs button { width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; }
#designs button:hover { background: var(--line); }
#designs button[aria-current="true"] { background: var(--ink); color: var(--scene); }
#designs button[aria-current="true"] .blurb { color: inherit; opacity: .75; }
.rank { font-family: var(--display); font-weight: 800; font-size: 15px; grid-row: span 2; font-variant-numeric: tabular-nums; }
.dname { font-weight: 700; }
.blurb { font-size: 12px; color: var(--muted); line-height: 1.35; min-width: 0; }

#top { position: fixed; right: var(--gap); top: calc(var(--gap) + env(safe-area-inset-top, 0px)); left: calc(300px + 2 * var(--gap)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
#artists, #views { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; padding: 6px; }

#timeline { position: fixed; left: var(--gap); right: var(--gap); bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px)); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
#play { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--scene); display: grid; place-items: center; grid-row: span 2; }
#play svg { width: 16px; height: 16px; fill: currentColor; }
#t { width: 100%; accent-color: var(--ink); margin: 0; }
#stepline { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; min-width: 0; }
#caption { font-weight: 600; min-width: 0; }
#stepno { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); }

@media (max-width: 760px) {
  #index { width: auto; right: var(--gap); max-height: 46%; }
  #index.closed #designs, #index.closed #sets { display: none; }
  #index header { cursor: pointer; }
  #index { z-index: 2; }
  #top { left: var(--gap); top: calc(84px + env(safe-area-inset-top, 0px)); align-items: stretch; gap: 6px; }
  #artists, #views { padding: 4px; }
  #timeline { grid-template-columns: auto 1fr; }
  #caption { font-size: 13px; }
  #artists, #views { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="gl" aria-label="3D-вид карточки"></canvas>
<div id="status">Загрузка…</div>

<aside id="index" class="panel closed">
  <header id="indexHead">
    <span class="eyebrow">Dinner · 10.10.2026 · посадочные карточки</span>
    <h1 id="dtitle">—</h1>
  </header>
  <div id="sets" role="group" aria-label="Набор"></div>
  <ol id="designs" aria-label="Варианты"></ol>
</aside>

<div id="top">
  <div id="artists" class="panel" role="group" aria-label="Артист"></div>
  <div id="views" class="panel" role="group" aria-label="Вид"></div>
</div>

<section id="timeline" class="panel" aria-label="Сборка">
  <button id="play" aria-label="Показать сборку"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></button>
  <div id="stepline"><span id="caption">Развёртка</span><span id="stepno"></span></div>
  <input id="t" type="range" min="0" max="1" step="0.01" value="1" aria-label="Ход сборки">
</section>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildCard } from './fold.js';
import { makeScene, viewPose } from './scene.js';

const SETS = [['system', 'Система'], ['fold', 'Сгиб'], ['edge', 'Край'], ['optic', 'Оптика']];
const VIEWS = [['seat', 'С места гостя'], ['orbit', 'Вокруг'], ['side', 'Сбоку'], ['top', 'Сверху']];
const $ = (id) => document.getElementById(id);
const canvas = $('gl');
const { renderer, scene, camera, table } = makeScene(canvas);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 80; controls.maxDistance = 3000;

const state = { set: 'system', design: null, artist: null, view: 'seat', t: 1, card: null, data: {}, playing: false };
let tween = null;

function sceneColour() {
  const css = getComputedStyle(document.documentElement);
  scene.background = new THREE.Color(css.getPropertyValue('--scene').trim() || '#d3cfc6');
  table.material.color.set(css.getPropertyValue('--table').trim() || '#b9b3a7');
}
sceneColour();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sceneColour);
new MutationObserver(sceneColour).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function chips(el, items, current, onPick) {
  el.replaceChildren(...items.map(([id, label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.setAttribute('aria-pressed', String(id === current));
    b.onclick = () => onPick(id);
    return b;
  }));
}

async function loadSet(id) {
  if (!state.data[id]) state.data[id] = await fetch(`data/${id}.json`).then((r) => r.json());
  return state.data[id];
}

function renderIndex() {
  const d = state.data[state.set];
  chips($('sets'), SETS, state.set, async (id) => { state.set = id; const s = await loadSet(id); state.design = s.designs[0].id; renderIndex(); show(); });
  $('designs').replaceChildren(...d.designs.map((x) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.setAttribute('aria-current', String(x.id === state.design));
    b.innerHTML = `<span class="rank">${x.rank}</span><span class="dname"></span><span class="blurb"></span>`;
    b.querySelector('.dname').textContent = x.title;
    b.querySelector('.blurb').textContent = x.blurb;
    b.onclick = () => { state.design = x.id; renderIndex(); show(); if (innerWidth <= 760) $('index').classList.add('closed'); };
    li.append(b); return li;
  }));
  const des = d.designs.find((x) => x.id === state.design);
  $('dtitle').textContent = `${d.title} · ${des.title}`;
  const names = des.cards.map((c) => [c.artist, c.artist]);
  if (!des.cards.some((c) => c.artist === state.artist)) state.artist = des.cards[0].artist;
  chips($('artists'), names, state.artist, (a) => { state.artist = a; renderIndex(); show(); });
  chips($('views'), VIEWS, state.view, (v) => { state.view = v; renderIndex(); flyTo(v); });
}

function setT(t) {
  state.t = t;
  $('t').value = t;
  if (!state.card) return;
  state.card.update(t);
  const n = state.card.maxStep, k = Math.min(n, Math.ceil(t - 1e-6));
  $('caption').textContent = k <= 0 ? 'Развёртка: так карточка печатается' : (state.card.steps[k - 1] || `Шаг ${k}`);
  $('stepno').textContent = k <= 0 ? `0 / ${n}` : `шаг ${k} / ${n}`;
}

function flyTo(view, instant) {
  if (!state.card) return;
  const keep = state.t; state.card.update(state.card.maxStep);
  const v = viewPose(view, state.card.object, state.spec, camera.aspect);
  state.card.update(keep);
  if (instant) {
    camera.position.copy(v.pos); controls.target.copy(v.target); camera.fov = v.fov; camera.updateProjectionMatrix(); tween = null; return;
  }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), f0: camera.fov, p1: v.pos, t1: v.target, f1: v.fov, s: performance.now() };
}

let showing = 0;
async function show() {
  const my = ++showing;
  const d = state.data[state.set], des = d.designs.find((x) => x.id === state.design);
  const card = des.cards.find((c) => c.artist === state.artist) || des.cards[0];
  $('status').hidden = false;
  const built = await buildCard(card.spec, `tex/${state.set}`);
  if (my !== showing) return;
  if (state.card) scene.remove(state.card.object);
  state.card = built; state.spec = card.spec;
  scene.add(built.object);
  $('t').max = built.maxStep;
  setT(built.maxStep);
  flyTo(state.view, true);
  $('status').hidden = true;
  try { history.replaceState(null, '', `#${state.set}.${state.design}`); } catch (e) {}
}

$('t').addEventListener('input', (e) => { state.playing = false; setT(parseFloat(e.target.value)); });
$('play').addEventListener('click', () => { state.playing = true; state.playStart = performance.now(); setT(0); });
$('indexHead').addEventListener('click', () => { if (innerWidth <= 760) $('index').classList.toggle('closed'); });
controls.addEventListener('start', () => { tween = null; if (state.view) { state.view = null; renderIndex(); } });

function frame(now) {
  requestAnimationFrame(frame);
  if (state.playing && state.card) {
    const t = (now - state.playStart) / 1500;
    if (t >= state.card.maxStep) { state.playing = false; setT(state.card.maxStep); } else setT(t);
  }
  if (tween) {
    const k = Math.min(1, (now - tween.s) / 700), e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.fov = tween.f0 + (tween.f1 - tween.f0) * e; camera.updateProjectionMatrix();
    if (k === 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

(async () => {
  try {
    const h = location.hash.slice(1).split('.');
    if (SETS.some(([id]) => id === h[0])) state.set = h[0];
    const s = await loadSet(state.set);
    state.design = s.designs.some((x) => x.id === h[1]) ? h[1] : s.designs[0].id;
    renderIndex();
    if (innerWidth > 760) $('index').classList.remove('closed');
    await show();
    requestAnimationFrame(frame);
    window.__ready = true;
  } catch (e) {
    $('status').textContent = 'Не удалось загрузить сцену. Обновите страницу.';
    window.__error = String(e && e.stack || e);
  }
})();
</script>
