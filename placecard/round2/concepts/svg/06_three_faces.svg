<text x="60.00" y="757.55" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Each triangle is printed both sides; 3 faces x 6 triangles = 18 = 9 x 2.</text>
<text x="60.00" y="775.10" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Face layout follows the standard trihexaflexagon template: mock it up in white paper before artwork.</text>
