<text x="936.00" y="536.00" font-size="13" font-weight="700" fill="#141414" text-anchor="middle" >THE POP</text>
<text x="936.00" y="556.00" font-size="12" font-weight="500" fill="#8d8a80" text-anchor="middle" >strap goes taut at 70 deg: card stands</text>
<text x="48.00" y="160.00" font-size="12" font-weight="700" fill="#8d8a80" text-anchor="start" letter-spacing="1" >SIDE SECTION AT 3:1, base card on the table, the red line is the rubber band</text>
<text x="70.00" y="586.00" font-size="12" font-weight="700" fill="#8d8a80" text-anchor="start" letter-spacing="1" >GUEST VIEW OF THE FLAP, 100 x 70 mm</text>
<polygon points="70.00,600.00 310.00,600.00 310.00,768.00 70.00,768.00" fill="#feed95" stroke="#141414" stroke-width="1.8" stroke-linejoin="round" />
<text x="190.00" y="681.60" font-size="26.4" font-weight="700" fill="#141414" text-anchor="middle" >Sophia</text>
<text x="190.00" y="720.00" font-size="26.4" font-weight="700" fill="#141414" text-anchor="middle" >Zhuravkova</text>
<text x="190.00" y="753.60" font-size="11.04" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="1.5" >DINNER  10.10.2026</text>
<polygon points="180.40,756.00 199.60,756.00 199.60,762.00 180.40,762.00" fill="none" stroke="none" stroke-width="0" stroke-linejoin="round" />
<text x="520.00" y="650.00" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Band loop 2 mm wide: 93 mm stretched when flat, 75 mm when upright.</text>
<text x="520.00" y="667.55" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >The anchor tab on the flap stands 5 mm off the card so the band</text>
<text x="520.00" y="685.10" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >pulls the flap over the hinge the moment the weight is gone.</text>
<text x="520.00" y="702.65" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >The napkin (about 40 g) is the weight. No spring steel, no glue,</text>
<text x="520.00" y="720.20" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >one die-cut sheet, a 47 mm paper strap (black dot to dot) as the stop, one band.</text>
<text x="520.00" y="737.75" font-size="13" font-weight="500" fill="#141414" text-anchor="start" ></text>
<text x="520.00" y="755.30" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Risk: the napkin must not be refolded on top by staff:</text>
<text x="520.00" y="772.85" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >brief the floor, or print LIFT on the napkin band.</text></svg>