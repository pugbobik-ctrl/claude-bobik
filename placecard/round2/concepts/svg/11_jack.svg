<text x="112.00" y="78.00" font-size="40" font-weight="700" fill="#141414" text-anchor="start" >JACK</text>
<text x="48.00" y="108.00" font-size="16" font-weight="400" fill="#555" text-anchor="start" >A folded napkin sits on the table. Lift it and a lemon card springs up from underneath, announcing the name.</text>
