<text x="246.00" y="536.00" font-size="13" font-weight="700" fill="#141414" text-anchor="middle" >IN THE KITCHEN</text>
<text x="246.00" y="556.00" font-size="12" font-weight="500" fill="#8d8a80" text-anchor="middle" >flap pinned flat by the napkin, band taut</text>
