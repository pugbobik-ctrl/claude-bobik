<text x="545.00" y="278.00" font-size="12" font-weight="600" fill="#8d8a80" text-anchor="middle" >napkin lifted away</text>
<text x="596.00" y="536.00" font-size="13" font-weight="700" fill="#141414" text-anchor="middle" >THE LIFT</text>
<text x="596.00" y="556.00" font-size="12" font-weight="500" fill="#8d8a80" text-anchor="middle" >band releases the flap</text>
