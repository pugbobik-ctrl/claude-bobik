<text x="48.00" y="160.00" font-size="12" font-weight="700" fill="#8d8a80" text-anchor="start" letter-spacing="1" >THE CARD, FOUR TIMES, THE SAME EVENING</text>
<text x="48.00" y="690.00" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Card 100 x 130 mm with a 16 mm window; strip of chromatography paper, 12 x 130 mm, tail 14 mm into a shot glass with 10 mm of water.</text>
<text x="48.00" y="707.55" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >The bar is dye-based black (inkjet black or a water-soluble marker): its dyes travel at different speeds, so one black becomes yellow, pink, blue.</text>
<text x="48.00" y="725.10" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Climb rate is the risk: filter paper rises about 10 mm in 2 min then slows. Needs a test with the actual ink and the room temperature.</text>
<text x="48.00" y="742.65" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >The shot glass is the second object on the table: a pour of water, a pour of colour.</text></svg>