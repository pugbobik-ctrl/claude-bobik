<text x="420.00" y="690.00" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Disc 70 mm, 400 gsm lemon card, both sides printed, 2 holes,</text>
<text x="420.00" y="707.55" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >2 x 150 mm black cotton thread loops tied to the glass stem.</text>
<text x="420.00" y="725.10" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Spin it once and it is a toy; every disc is the same plate,</text>
<text x="420.00" y="742.65" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >only the name changes: one artwork file, 40 names.</text>
