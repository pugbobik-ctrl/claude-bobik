<text x="630.30" y="474.00" font-size="12" font-weight="700" fill="#8d8a80" text-anchor="middle" letter-spacing="1" >RECOIL</text>
<text x="800.00" y="200.00" font-size="12" font-weight="700" fill="#8d8a80" text-anchor="start" letter-spacing="1" >WHY IT RIGHTS ITSELF</text>
<text x="800.00" y="225.00" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Centre of mass (red) sits 13.3 mm below the ball centre,</text>
<text x="800.00" y="242.55" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >so any tilt lifts it: it always rolls back.</text>
<text x="800.00" y="260.10" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Rocking period about 0.57 s, fading over 3 to 4 s.</text>
<text x="800.00" y="277.65" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Masses: shell 3 g, cone 4 g, steel weight 15 g.</text>
<text x="48.00" y="590.00" font-size="12" font-weight="700" fill="#8d8a80" text-anchor="start" letter-spacing="1" >FLAT PARTS (mm)</text>
