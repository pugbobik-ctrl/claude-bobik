<text x="500.00" y="721.10" font-size="12" font-weight="500" fill="#141414" text-anchor="start" >6 gores for the ball (3 shown)</text>
<text x="48.00" y="790.00" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >Cone and ball are one lemon sheet. Cone: 85 mm, ball 60 mm across; name printed up the axis.</text>
<text x="48.00" y="807.55" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >The weight is a 15 g steel washer stack glued in the ball. A fingertip flick sets it rocking;</text>
<text x="48.00" y="825.10" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >with 6 on a table the room fills with small nodding lamps.</text>
<text x="48.00" y="842.65" font-size="13" font-weight="500" fill="#141414" text-anchor="start" ></text>
<text x="48.00" y="860.20" font-size="13" font-weight="500" fill="#141414" text-anchor="start" >The table lamps are cones. These are the same cone, nodding.</text></svg>