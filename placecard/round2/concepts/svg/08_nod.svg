<text x="112.00" y="78.00" font-size="40" font-weight="700" fill="#141414" text-anchor="start" >NOD</text>
<text x="48.00" y="108.00" font-size="16" font-weight="400" fill="#555" text-anchor="start" >A tiny lamp that cannot fall over. Flick it and it nods to you, rocks for a few seconds, and settles facing you again.</text>
