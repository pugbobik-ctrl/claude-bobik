<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1200" viewBox="0 0 420 300"><defs><style>
        text { font-family: 'Wix Madefor Text', sans-serif; }
        .cut { stroke:#d4007a; stroke-width:.35; stroke-linejoin:round; stroke-linecap:round }
        .val { stroke:#1769e0; stroke-width:.3; stroke-dasharray:2.6 1.3 }
        .mtn { stroke:#e03a1e; stroke-width:.3; stroke-dasharray:5 1.2 .9 1.2 }
        .emb { stroke:#0a8f80; stroke-width:.3 }
        .thin { stroke:#9a9a9a; stroke-width:.2 }
        .dim { stroke:#444; stroke-width:.18 }
        .edge { stroke:#6d5a10; stroke-width:.22; stroke-linejoin:round }
        .edgeL { stroke:#b79c2a; stroke-width:.18; stroke-linejoin:round }
        .ink { stroke:#111111; stroke-width:.5; stroke-linecap:round; stroke-linejoin:round }
        .shadow { fill:#000; opacity:.13 }
        </style></defs><rect x="0" y="0" width="420" height="300" fill="#ffffff"/><text x="10" y="13" font-size="5.2" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >05  FLAG UP — napkin-triggered pull-tab pop-up</text><text x="10" y="18.2" font-size="2.8" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >Dieline 1:1 (mm), guest edge at the bottom of every part. 4 parts: A top card, C spacer, B base, D leg-and-slider strip. Lemon board, black print.</text><rect x="10" y="30" width="124" height="88" rx="2" class="cut" fill="#feed95" /><line x1="22" y1="98" x2="22" y2="48" class="cut" /><line x1="122" y1="98" x2="122" y2="48" class="cut" /><line x1="22" y1="48" x2="122" y2="48" class="cut" /><line x1="22" y1="98" x2="122" y2="98" class="val" /><text x="72" y="67.5" font-size="15.5" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Sophia</text><text x="72" y="84" font-size="15.5" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Zhuravkova</text><rect x="70.5" y="107" width="3" height="3" rx="0" class="cut" fill="#ffffff" /><text x="75" y="109" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >latch window 3 x 3</text><text x="10" y="27" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >A  top card, 350 g  (flag is cut out of it)</text><text x="12" y="113" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >guest edge</text><text x="72" y="43" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >far edge</text><text x="23" y="96.5" font-size="2.2" font-weight="400" fill="#1769e0" text-anchor="start" letter-spacing="0" >hinge crease, valley, y = 20</text><rect x="12.5" y="32.5" width="119" height="83" rx="0" class="thin" fill="none" stroke-dasharray=".8 1"/><text x="10" y="124" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >A reverse (flag back, read by the person opposite):</text><rect x="20" y="126.5" width="100" height="28" rx="0" class="thin" fill="#feed95" /><text x="70" y="141" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >Dinner</text><text x="70" y="148" font-size="3" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >Colorblock × DNA Kitchen · Moscow · 10.10.2026</text><rect x="144" y="30" width="124" height="88" rx="2" class="cut" fill="#feed95" /><rect x="156" y="48" width="100" height="50" rx="0" class="cut" fill="#ffffff" /><rect x="199.7" y="98" width="12.6" height="20" rx="0" class="cut" fill="#ffffff" /><text x="144" y="27" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >C  spacer, 0.9 mm board  (window + 12.6 mm channel)</text><text x="214" y="108" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >channel 12.6 wide</text><text x="206" y="73" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >window = flag 100 x 50</text><text x="206" y="76.5" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >(shoulder stop = this edge, y = 20)</text><rect x="146.5" y="32.5" width="119" height="83" rx="0" class="thin" fill="none" stroke-dasharray=".8 1"/><rect x="278" y="30" width="124" height="88" rx="2" class="cut" fill="#feed95" /><text x="278" y="27" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >B  base, 350 g  (solid black pit under the flag)</text><rect x="290" y="48" width="100" height="50" rx="0" class="thin" fill="none" stroke-dasharray="1 1"/><rect x="289" y="47" width="102" height="52" rx="0" class="thin" fill="#111111" /><text x="340" y="72" font-size="2.6" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="0" >solid black pit (bleeds 1 mm under C)</text><text x="340" y="76" font-size="2.4" font-weight="400" fill="#cfcfcf" text-anchor="middle" letter-spacing="0" >the leg and the slider are lemon on black</text><rect x="333.7" y="98" width="12.6" height="20" rx="0" class="thin" fill="none" stroke-dasharray="1 1"/><rect x="280.5" y="32.5" width="119" height="83" rx="0" class="thin" fill="none" stroke-dasharray=".8 1"/><text x="10" y="160" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >D  leg + slider strip, 12 wide, 350 g, one piece, doubled at the foot fold</text><rect x="10" y="168" width="8" height="12" rx="0" class="cut" fill="#feed95" /><rect x="18" y="168" width="30" height="12" rx="0" class="cut" fill="#feed95" /><rect x="48" y="168" width="65" height="12" rx="0" class="cut" fill="#feed95" /><rect x="113" y="168" width="20" height="12" rx="0" class="cut" fill="#feed95" /><rect x="133" y="168" width="60" height="12" rx="0" class="cut" fill="#feed95" /><line x1="18" y1="168" x2="18" y2="180" class="val" /><line x1="48" y1="168" x2="48" y2="180" class="mtn" /><text x="18" y="183.5" font-size="2.2" font-weight="400" fill="#1769e0" text-anchor="middle" letter-spacing="0" >P hinge</text><text x="48" y="183.5" font-size="2.2" font-weight="400" fill="#e03a1e" text-anchor="middle" letter-spacing="0" >F fold 180 deg</text><rect x="77.3" y="166" width="6" height="16" rx="0" class="cut" fill="#feed95" /><text x="80.3" y="164.5" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >shoulder 16 x 6</text><path d="M89.3,172.5 L94.3,172.5 L94.3,175.5 L89.3,175.5" class="cut" fill="none" /><text x="91.3" y="187" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >latch tongue 5 x 3, bent up 0.5</text><line x1="133" y1="169" x2="133" y2="170" class="cut" /><line x1="133" y1="171" x2="133" y2="172" class="cut" /><line x1="133" y1="173" x2="133" y2="174" class="cut" /><line x1="133" y1="175" x2="133" y2="176" class="cut" /><line x1="133" y1="177" x2="133" y2="178" class="cut" /><line x1="133" y1="179" x2="133" y2="180" class="cut" /><text x="133" y="183.5" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >perforation (tear 1-1.5 N)</text><rect x="179" y="172.5" width="10" height="3" rx="0" class="cut" fill="#ffffff" /><text x="184" y="183.5" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >napkin slot 10 x 3</text><text x="10" y="192" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >length 183 mm, drawn 1:1 (strip is folded back at F, so the doubled part is 30 mm long, slider is 65 + 20 + 60 beyond it)</text><text x="10" y="199" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >BUILD ORDER</text><text x="10" y="203.05" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >1  Cut A, B, C, D. Print B (pit) and A (flag) black. Score A hinge y = 20 (valley, from the print side), D at P and F.</text><text x="10" y="207.1" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >2  Glue D's tab to the BACK of the flag at y = 27..35 (P hinge on y = 35 -> 15 mm from the card hinge). Flag lies flat, window closed.</text><text x="10" y="211.15" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >3  Fold D back 180 deg at F; drop the doubled leg + slider into the channel of C, shoulder inside the window zone, tail out the guest edge.</text><text x="10" y="215.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >4  Glue A + C + B at the 2.5 mm borders (A to C, C to B). Tongue on D must line up with the latch window in A when the stroke is complete.</text><text x="10" y="219.25" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >5  Table: thread the napkin's rolled corner through the 10 x 3 slot in the tail. Lift the napkin toward the lap: the flag stands, the latch clicks, the perforation tears.</text><line x1="230" y1="222.4" x2="238" y2="222.4" class="cut" /><text x="240.5" y="223" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >cut</text><line x1="230" y1="227" x2="238" y2="227" class="val" /><text x="240.5" y="227.6" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >valley crease</text><line x1="230" y1="231.6" x2="238" y2="231.6" class="mtn" /><text x="240.5" y="232.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >mountain crease</text><line x1="230" y1="236.2" x2="238" y2="236.2" class="thin" /><text x="240.5" y="236.8" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >glue border 2.5 / 10 x 3 slot</text></svg>