        </style></defs><rect x="0" y="0" width="560" height="500" fill="#ffffff"/><text x="12" y="14" font-size="5.2" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >01  KOSODE — origata-style diagonal wrap, name under the V-flap</text><text x="12" y="19.2" font-size="2.8" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >Dieline + fold diagram. Print (lining) side shown. One 200 x 200 mm square sheet, 135 g lemon paper; folds only, no cuts, no glue.</text><polygon points="148,108.579 6.579,250 148,391.421 289.421,250" class="cut" fill="#feed95" /><rect x="88" y="215" width="120" height="70" rx="0" class="thin" fill="#f4f1ea" stroke-dasharray="1.5 1"/><rect x="82" y="209" width="132" height="82" rx="0" class="thin" fill="none" stroke-dasharray="0.6 1.2"/><text x="148" y="251" font-size="2.6" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >napkin pack 120 x 70 x 12</text><text x="148" y="255" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >(effective footprint 132 x 82)</text><line x1="47.579" y1="291" x2="248.421" y2="291" class="val" /><line x1="211.021" y1="171.6" x2="214.838" y2="324.584" class="val" /><line x1="81.162" y1="324.584" x2="84.979" y2="171.6" class="val" /><line x1="86.479" y1="170.1" x2="209.521" y2="170.1" class="val" /><text x="148" y="144" font-size="12" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Sophia</text><text x="148" y="158" font-size="12" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Zhuravkova</text><text x="148" y="165" font-size="2.4" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >Dinner · Colorblock × DNA Kitchen · Moscow · 10 Oct 2026</text><circle cx="148" cy="305" r="3.4" class="thin" fill="#fff" /><text x="148" y="306.3" font-size="3.6" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >1</text><circle cx="244" cy="242" r="3.4" class="thin" fill="#fff" /><text x="244" y="243.3" font-size="3.6" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >2</text><circle cx="52" cy="242" r="3.4" class="thin" fill="#fff" /><text x="52" y="243.3" font-size="3.6" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >3</text><circle cx="148" cy="177.6" r="3.4" class="thin" fill="#fff" /><text x="148" y="178.9" font-size="3.6" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >4</text><text x="148" y="399.421" font-size="2.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >Shown corner-up, the way it is folded. Print file: the square sheet with the art turned 45 deg.</text><text x="148" y="264" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >name: Wix Madefor Text SemiBold 12 mm, cap-height 8.6 mm, 'Zhuravkova' 67.5 mm wide</text><polygon points="354.7,36.231 308.031,82.9 354.7,129.569 401.369,82.9" class="shadow"/><polygon points="354,35.331 307.331,82 354,128.669 400.669,82" fill="#feed95" class="edge"/><text x="294" y="132" font-size="2.5" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >0 Napkin pack on printed (lining) face</text><polygon points="482.7,36.231 436.031,82.9 449.561,96.43 515.839,96.43 529.369,82.9" class="shadow"/><polygon points="482,35.331 435.331,82 448.861,95.53 515.139,95.53 528.669,82" fill="#feed95" class="edge"/><rect x="462.2" y="70.45" width="39.6" height="23.1" fill="#f4f1ea" stroke="#9c9688" stroke-width=".25"/><line x1="462.2" y1="74.3" x2="501.8" y2="74.3" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="78.15" x2="501.8" y2="78.15" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="82" x2="501.8" y2="82" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="85.85" x2="501.8" y2="85.85" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="89.7" x2="501.8" y2="89.7" stroke="#d