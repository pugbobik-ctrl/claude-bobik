67.633" fill="#feed95" class="edge"/><rect x="462.2" y="282.45" width="39.6" height="23.1" fill="#f4f1ea" stroke="#9c9688" stroke-width=".25"/><line x1="462.2" y1="286.3" x2="501.8" y2="286.3" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="290.15" x2="501.8" y2="290.15" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="294" x2="501.8" y2="294" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="297.85" x2="501.8" y2="297.85" stroke="#d9d4c6" stroke-width=".15"/><line x1="462.2" y1="301.7" x2="501.8" y2="301.7" stroke="#d9d4c6" stroke-width=".15"/><polygon points="461.211,296.78 482.7,275.291 504.189,296.78 504.48,308.43 460.92,308.43" class="shadow"/><polygon points="460.511,295.88 482,274.391 503.489,295.88 503.78,307.53 460.22,307.53" fill="#fbe684" class="edge"/><polygon points="504.189,296.78 493.135,308.996 504.48,308.43" class="shadow"/><polygon points="503.489,295.88 492.435,308.096 503.78,307.53" fill="#feed95" class="edge"/><polygon points="504.48,308.43 493.135,308.996 478.947,296.158 503.497,269.028" class="shadow"/><polygon points="503.78,307.53 492.435,308.096 478.247,295.258 502.797,268.128" fill="#fbe684" class="edge"/><polygon points="472.265,308.996 461.211,296.78 460.92,308.43" class="shadow"/><polygon points="471.565,308.096 460.511,295.88 460.22,307.53" fill="#feed95" class="edge"/><polygon points="461.903,269.028 486.453,296.158 472.265,308.996 460.92,308.43" class="shadow"/><polygon points="461.203,268.128 485.753,295.258 471.565,308.096 460.22,307.53" fill="#fbe684" class="edge"/><polygon points="482.7,288.835 462.398,268.533 503.002,268.533" class="shadow"/><polygon points="482,287.935 461.698,267.633 502.302,267.633" fill="#fbe684" class="edge"/><line x1="482" y1="265.653" x2="482" y2="309.84" class="ink" stroke-width=".9"/><text x="422" y="344" font-size="2.5" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >5 Cord round the waist, bow on the flap</text><text x="292" y="362" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >FOLD SEQUENCE   napkin pack centred print-face-up, corner toward you</text><text x="292" y="366.05" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >1  Bottom corner up along y = -41 (pack's lower edge + half thickness).</text><text x="292" y="370.1" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >2  Right corner in along the line from shoulder (63.0, 78.4) to (66, -41).</text><text x="292" y="374.15" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >3  Left corner in along the mirror line, OVER the right lapel (migi-mae, left-over-right):</text><text x="292" y="378.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >    lapel tips land at +/-11.4 mm past the centreline, so they overlap 22.8 mm.</text><text x="292" y="382.25" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >4  Apex down along y = 79.9; its tip lands at y = 18.4, covering the upper pack.</text><text x="292" y="386.3" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >5  2 mm black waxed cord round the short way (about 400 mm), bow on the V-flap.</text><text x="292" y="390.35" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >Guest: pull the bow, lift the V-flap; the name sits on its lining, upright toward the seat.</text><line x1="292" y1="417.4" x2="300" y2="417.4" class="val" /><text x="302.5" y="418" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >valley fold toward you (all four folds), scored 0.4 mm on the print side</text><line x1="292" y1="422" x2="300" y2="422" class="cut" /><text x="302.5" y="422.6" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >sheet edge (guillotine, no die)</text><line x1="292" y1="426.6" x2="300" y2="426.6" class="thin" /><text x="302.5" y="427.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >napkin pack; dotted = effective footprint incl. thickness</text><text x="292" y="444" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >Reverse plate (optional duplex): 'Dinner' | date either side of the cord line.</text><polygon points="490,397.574 447.574,440 490,482.426 532.426,440" class="thin" fill="#fff" /><line x1="471.544" y1="416.03" x2="508.456" y2="416.03" class="val" /><g transform="rotate(180 490 416.03)"><text x="488.5" y="421.4" font-size="3" font-weight="700" text-anchor="end" fill="#111111">Dinner</text><text x="491.5" y="421.4" font-size="1.5" font-weight="500" text-anchor="start" fill="#111111">10.10.2026</text></g></svg>