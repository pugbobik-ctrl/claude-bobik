        </style><pattern id="hg" width="2" height="2" patternUnits="userSpaceOnUse"><line x1="0" y1="1" x2="2" y2="1" stroke="#0a8f80" stroke-width=".22"/></pattern><pattern id="hv" width="2" height="2" patternUnits="userSpaceOnUse"><line x1="1" y1="0" x2="1" y2="2" stroke="#0a8f80" stroke-width=".22"/></pattern><clipPath id="card"><rect x="18" y="30" width="118.0" height="64.0" rx="3"/></clipPath></defs><rect x="0" y="0" width="330" height="215" fill="#ffffff"/><text x="10" y="13" font-size="5.2" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >04  RAKING LIGHT — dieline and relief map</text><text x="10" y="18.2" font-size="2.8" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >1:1 (mm). 118 x 64 x 1.4 board, corner radius 3. Plate 1: black (Dinner, date, event, find-aid). Plate 2: blind relief, name in vertical lines on a ground of horizontal lines.</text><rect x="18" y="30" width="118" height="64" rx="3" class="cut" fill="#feed95" /><rect x="21" y="33" width="112.0" height="58.0" fill="url(#hg)" clip-path="url(#card)"/><text x="77.0" y="65.0" font-size="16.0" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="0.4">Sophia</text><text x="77.0" y="65.0" font-size="16.0" font-weight="700" text-anchor="middle" fill="url(#hv)">Sophia</text><text x="77.0" y="83.0" font-size="16.0" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="0.4">Zhuravkova</text><text x="77.0" y="83.0" font-size="16.0" font-weight="700" text-anchor="middle" fill="url(#hv)">Zhuravkova</text><text x="24" y="40.5" font-size="8" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >Dinner</text><text x="130" y="40.5" font-size="3.6" font-weight="500" fill="#111111" text-anchor="end" letter-spacing="0" >10.10.2026</text><text x="24" y="89" font-size="2.5" font-weight="500" fill="#111111" text-anchor="start" letter-spacing="0" >Colorblock × DNA Kitchen · Moscow</text><text x="130" y="89" font-size="2.5" font-weight="700" fill="#111111" text-anchor="end" letter-spacing="0" >S.Zh.</text><text x="18" y="27" font-size="2.5" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >front (relief map drawn at 4x the real 0.5 mm pitch so it can be seen)</text><line x1="18" y1="99" x2="136" y2="99" class="dim" /><text x="77" y="103" font-size="2.6" font-weight="400" fill="#111111" text-anchor="middle" letter-spacing="0" >118</text><line x1="13" y1="30" x2="13" y2="94" class="dim" /><text transform="translate(10 62.0) rotate(-90)" font-size="2.6" text-anchor="middle" fill="#111111">64</text><rect x="21" y="33" width="112" height="58" rx="0" class="emb" fill="none" stroke-dasharray=".8 .8"/><text x="22" y="31.9" font-size="2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" ></text><text x="21" y="109" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >dashed: relief field, 3 mm inside the edge (edge stays flat for the die-cut)</text><rect x="158" y="30" width="118" height="64" rx="3" class="cut" fill="#feed95" /><text x="158" y="27" font-size="2.5" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >back: plain, or a one-line black menu / seating note</text><text x="217" y="59" font-size="6" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Sophia Zhuravkova</text><text x="217" y="65.5" font-size="2.8" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >table 1, long side</text><text x="217" y="71" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >(optional: the name in plain ink, face down as a fallback)</text><text x="18" y="127" font-size="3" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >Zoom 12 x 7 mm at the edge of an 'h' stem (x6 of real size, true pitch 0.5)</text><clipPath id="zc"><rect x="18" y="130" width="84.0" height="49.0