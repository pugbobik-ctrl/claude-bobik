or="start" letter-spacing="0" >one polymer plate per guest, 8-up on A4 plates; die-cut after embossing (corner radius 3)</text><text x="130" y="154.3" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" ></text><text x="130" y="158.35" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >Text widths:  Sophia 53.9 mm,  Zhuravkova 91.3 mm  (field 112 wide)</text><line x1="130" y1="184.4" x2="138" y2="184.4" class="cut" /><text x="140.5" y="185" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >die cut, R3</text><line x1="130" y1="189" x2="138" y2="189" class="emb" /><text x="140.5" y="189.6" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >relief field boundary (blind)</text><rect x="130" y="192" width="8" height="3.2" rx="0" class="thin" fill="#feed95" /><text x="140.5" y="194.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >board: 1.4 mm lemon (duplex 2 x 700 g or solid 1.4 mm)</text></svg>