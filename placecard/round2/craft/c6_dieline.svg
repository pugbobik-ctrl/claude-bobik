        .shadow { fill:#000; opacity:.13 }
        </style></defs><rect x="0" y="0" width="330" height="250" fill="#ffffff"/><text x="10" y="13" font-size="5.2" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >06  WALK-BY — a pleated name that turns into 'Dinner' as you walk past</text><text x="10" y="18.2" font-size="2.8" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >Dieline 1:1 (mm). 200 g lemon: pleated strip (print file with interleaved strips) + 300 g tent card. Black print.</text><text x="14" y="35" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >1  PLEATED STRIP  171.5 x 34   (13 x [A 9.0 + B 2.96], tabs 8.0)</text><rect x="14" y="40" width="171.475" height="34" rx="0" class="cut" fill="#feed95" /><clipPath id="a1"><rect x="22" y="40" width="9.0" height="34.0"/></clipPath><g clip-path="url(#a1)"><g transform="translate(22 40) scale(1.051 1)"><text x="0.479" y="22.8" font-size="12" font-weight="600" fill="#111111">Sophia Zhuravkova</text></g></g><clipPath id="b2"><rect x="31" y="40" width="2.96" height="34.0"/></clipPath><g clip-path="url(#b2)"><g transform="translate(31 40)"><text x="1.605" y="10.5" font-size="11" font-weight="700" fill="#111111">Dinner</text><text x="7.982" y="31.2" font-size="4.4" font-weight="500" fill="#111111">10.10.2026</text></g></g><line x1="22" y1="40" x2="22" y2="74" class="val" /><line x1="31" y1="40" x2="31" y2="74" class="mtn" /><clipPath id="a3"><rect x="33.96" y="40" width="9.0" height="34.0"/></clipPath><g clip-path="url(#a3)"><g transform="translate(24.96 40) scale(1.051 1)"><text x="0.479" y="22.8" font-size="12" font-weight="600" fill="#111111">Sophia Zhuravkova</text></g></g><clipPath id="b4"><rect x="42.96" y="40" width="2.96" height="34.0"/></clipPath><g clip-path="url(#b4)"><g transform="translate(40 40)"><text x="1.605" y="10.5" font-size="11" font-weight="700" fill="#111111">Dinner</text><text x="7.982" y="31.2" font-size="4.4" font-weight="500" fill="#111111">10.10.202