ht="600" fill="#111111">Sophia Zhuravkova</text></g></g><clipPath id="b22"><rect x="150.596" y="40" width="2.96" height="34.0"/></clipPath><g clip-path="url(#b22)"><g transform="translate(121 40)"><text x="1.605" y="10.5" font-size="11" font-weight="700" fill="#111111">Dinner</text><text x="7.982" y="31.2" font-size="4.4" font-weight="500" fill="#111111">10.10.2026</text></g></g><line x1="141.596" y1="40" x2="141.596" y2="74" class="val" /><line x1="150.596" y1="40" x2="150.596" y2="74" class="mtn" /><clipPath id="a23"><rect x="153.556" y="40" width="9.0" height="34.0"/></clipPath><g clip-path="url(#a23)"><g transform="translate(54.556 40) scale(1.051 1)"><text x="0.479" y="22.8" font-size="12" font-weight="600" fill="#111111">Sophia Zhuravkova</text></g></g><clipPath id="b24"><rect x="162.556" y="40" width="2.96" height="34.0"/></clipPath><g clip-path="url(#b24)"><g transform="translate(130 40)"><text x="1.605" y="10.5" font-size="11" font-weight="700" fill="#111111">Dinner</text><text x="7.982" y="31.2" font-size="4.4" font-weight="500" fill="#111111">10.10.2026</text></g></g><line x1="153.556" y1="40" x2="153.556" y2="74" class="val" /><line x1="162.556" y1="40" x2="162.556" y2="74" class="mtn" /><clipPath id="a25"><rect x="165.516" y="40" width="9.0" height="34.0"/></clipPath><g clip-path="url(#a25)"><g transform="translate(57.516 40) scale(1.051 1)"><text x="0.479" y="22.8" font-size="12" font-weight="600" fill="#111111">Sophia Zhuravkova</text></g></g><clipPath id="b26"><rect x="174.516" y="40" width="2.96" height="34.0"/></clipPath><g clip-path="url(#b26)"><g transform="translate(139 40)"><text x="1.605" y="10.5" font-size="11" font-weight="700" fill="#111111">Dinner</text><text x="7.982" y="31.2" font-size="4.4" font-weight="500" fill="#111111">10.10.2026</text></g></g><line x1="165.516" y1="40" x2="165.516" y2="74" class="val" /><line x1="174.516" y1="40" x2="174.516" y2="74" class="mtn" /><line x1="22" y1="40" x2="22" y2="74" class="thin" /><line x1="177.475" y1="40" x2="177.475" y2="74" class="thin" /><text x="15" y="78" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >tab 8</text><line x1="14" y1="81" x2="185.475" y2="81" class="dim" /><text x="99.738" y="85" font-size="2.6" font-weight="400" fill="#111111" text-anchor="middle" letter-spacing="0" >171.5</text><text x="190" y="35" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >2  TENT CARD  136 x 100, 300 g</text><rect x="190" y="40" width="136" height="100" rx="0" class="cut" fill="#feed95" /><line x1="190" y1="90" x2="326" y2="90" class="val" /><text x="258" y="88.5" font-size="2.2" font-weight="400" fill="#1769e0" text-anchor="middle" letter-spacing="0" >valley = tent top</text><rect x="195.784" y="98" width="124.433" height="34" rx="0" class="thin" fill="none" stroke-dasharray="1 1"/><text x="258" y="115.5" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >strip sits here: 124.4 wide</text><line x1="195.784" y1="106" x2="195.784" y2="124" class="cut" /><line x1="320.216" y1="106" x2="320.216" y2="124" class="cut" /><text x="194.284" y="104" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >slit 18 (tab 8 x 18 passes through)</text><g transform="rotate(180 258 65)"><text x="258" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Dinner</text><text x="258" y="72" font-size="2.8" font-weight="500" text-anchor="middle" fill="#111111">Colorblock × DNA Kitchen · Moscow · 10 Oct 2026</text></g><text x="258" y="45" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >(back panel, printed upside down so it reads for the person opposite)</text><text x="258" y="145" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >guest side is the lower half; the tent is closed by its own fold</text><text x="14" y="150" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >MAKE (4 min each)</text><text x="14" y="154.05" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >1  Print the strip file (interleaved A / B slices) and the tent. B ink is confined to the top 12 and bottom 6 mm so it never crosses the name.</text><text x="14" y="158.1" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >2  Score the 26 vertical creases from the printed side with a 0.4 mm crease rule (digital cutter crease wheel).</text><text x="14" y="162.15" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >3  Pleat on a jig (two 1 mm corrugated boards with 18 deg / 70 deg wedge slots), or by hand from the left end: valley, mountain, valley ...</text><text x="14" y="166.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >4  Slide the two 8 mm tabs through the slits in the tent's front panel, fold flat behind, tape.</text><text x="14" y="170.25" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >5  Teeth: A faces the seat; short steep B faces the walker (right-hand side of the seat).</text><line x1="190" y1="159.4" x2="198" y2="159.4" class="cut" /><text x="200.5" y="160" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >cut / outline</text><line x1="190" y1="164" x2="198" y2="164" class="val" /><text x="200.5" y="164.6" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >valley</text><line x1="190" y1="168.6" x2="198" y2="168.6" class="mtn" /><text x="200.5" y="169.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >mountain</text><line x1="190" y1="173.2" x2="198" y2="173.2" class="thin" /><text x="200.5" y="173.8" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >tab line / strip position</text></svg>