<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1250" viewBox="0 0 330 250"><defs><style>
        text { font-family: 'Wix Madefor Text', sans-serif; }
        .cut { stroke:#d4007a; stroke-width:.35; stroke-linejoin:round; stroke-linecap:round }
        .val { stroke:#1769e0; stroke-width:.3; stroke-dasharray:2.6 1.3 }
        .mtn { stroke:#e03a1e; stroke-width:.3; stroke-dasharray:5 1.2 .9 1.2 }
        .emb { stroke:#0a8f80; stroke-width:.3 }
        .thin { stroke:#9a9a9a; stroke-width:.2 }
        .dim { stroke:#444; stroke-width:.18 }
        .edge { stroke:#6d5a10; stroke-width:.22; stroke-linejoin:round }
        .edgeL { stroke:#b79c2a; stroke-width:.18; stroke-linejoin:round }
        .ink { stroke:#111111; stroke-width:.5; stroke-linecap:round; stroke-linejoin:round }
        .shadow { fill:#000; opacity:.13 }
        </style></defs><rect x="0" y="0" width="330" height="250" fill="#ffffff"/><text x="10" y="13" font-size="5.2" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >03  ONE THREAD — a 4-page book sewn with the thread that becomes the napkin ring</text><text x="10" y="18.2" font-size="2.8" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >Dieline 1:1 (mm). One 104 x 80 sheet of 300 g lemon board, scored once, three pierced holes on the fold. Black waxed linen thread 0.6 mm, 500 mm.</text><rect x="14" y="28" width="104" height="80" rx="0" class="cut" fill="#feed95" /><line x1="66" y1="28" x2="66" y2="108" class="mtn" /><circle cx="66" cy="40" r="0.9" class="cut" fill="#ffffff" /><circle cx="66" cy="68" r="1.3" class="cut" fill="#ffffff" /><circle cx="66" cy="96" r="0.9" class="cut" fill="#ffffff" /><text x="14" y="25" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >OUTSIDE (print plate 1)  fold = mountain</text><text x="40" y="102" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >back cover: blank lemon</text><text x="92" y="54" font-size="11" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >Dinner</text><text x="92" y="61" font-size="3.4" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >10.10.2026</text><text x="92" y="102" font-size="2.6" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >Colorblock × DNA Kitchen</text><rect x="136" y="28" width="104" height="80" rx="0" class="cut" fill="#feed95" /><line x1="188" y1="28" x2="188" y2="108" class="val" /><circle cx="188" cy="40" r="0.9" class="cut" fill="#ffffff" /><circle cx="188" cy="68" r="1.3" class="cut" fill="#ffffff" /><circle cx="188" cy="96" r="0.9" class="cut" fill="#ffffff" /><text x="136" y="25" font-size="2.8" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >INSIDE (print plate 2)  fold = valley</text><text x="162" y="62" font-size="3.8" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Colorblock</text><text x="162" y="67" font-size="3.8" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >× DNA Kitchen</text><text x="162" y="74" font-size="3" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >Moscow</text><text x="162" y="78" font-size="3" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >10 October 2026</text><text x="214" y="64" font-size="7.6" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Sophia</text><text x="214" y="72.6" font-size="7.6" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Zhuravkova</text><line x1="14" y1="113" x2="118" y2="113" class="dim" /><text x="66" y="117" font-size="2.6" font-weight="400" fill="#111111" text-anchor="middle" letter-spacing="0" >104</text><line x1="10" y1="28" x2="10" y2="108" class="dim" /><text transform="translate(7 68.0) rotate(-90)" font-size="2.6" text-anchor="middle" fill="#111111">80</text><text x="63.5" y="40.8" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="end" letter-spacing="0" >H1  y = 12, hole 0.9</text><text x="63.5" y="68.8" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="end" letter-spacing="0" >H2  y = 40, hole 1.3</text><text x="63.5" y="96.8" font-size="2.3" font-weight="400" fill="#6b6b6b" text-anchor="end" letter-spacing="0" >H3  y = 68, hole 0.9</text><text x="14" y="127" font-size="3" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >Thread path along the spine</text><line x1="50" y1="135" x2="50" y2="215" class="mtn" /><circle cx="50" cy="147" r="1.2" class="thin" fill="#fff" /><text x="52.4" y="147.9" font-size="2.4" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >H1</text><circle cx="50" cy="175" r="1.2" class="thin" fill="#fff" /><text x="52.4" y="175.9" font-size="2.4" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >H2</text><circle cx="50" cy="203" r="1.2" class="thin" fill="#fff" /><text x="52.4" y="203.9" font-size="2.4" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >H3</text><line x1="32" y1="169" x2="50" y2="175" stroke="#111111" stroke-width=".55"  stroke-linecap="round"/><line x1="50" y1="175" x2="60" y2="173" stroke="#111111" stroke-width=".55" stroke-dasharray="1.4 .9" stroke-linecap="round"/><line x1="60" y1="173" x2="60" y2="149" stroke="#111111" stroke-width=".55" stroke-dasharray="1.4 .9" stroke-linecap="round"/><line x1="60" y1="149" x2="50" y2="147" stroke="#111111" stroke-width=".55" stroke-dasharray="1.4 .9" stroke-linecap="round"/><line x1="50" y1="147" x2="40" y2="149" stroke="#111111" stroke-width=".55"  stroke-linecap="round"/><line x1="40" y1="149" x2="40" y2="201" stroke="#111111" stroke-width=".55"  stroke-linecap="round"/><line x1="40" y1="201" x2="50" y2="203" stroke="#111111" stroke-width=".55"  stroke-linecap="round"/><line x1="50" y1="203" x2="63" y2="201" stroke="#111111" stroke-width=".55" stroke-dasharray="1.4 .9" stroke-linecap="round"/><line x1="63" y1="201" x2="63" y2="177" stroke="#111111" stroke-width=".55" stroke-dasharray="1.4 .9" stroke-linecap="round"/><line x1="63" y1="177" x2="50" y2="175" stroke="#111111" stroke-width=".55" stroke-dasharray="1.4 .9" stroke-linecap="round"/><line x1="50" y1="175" x2="32" y2="181" stroke="#111111" stroke-width=".55"  stroke-linecap="round"/><text x="28" y="168" font-size="2.4" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" >tail A</text><text x="28" y="184" font-size="2.4" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" >tail B</text><text x="38.5" y="174.5" font-size="2.4" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" >long stitch</text><text x="50" y="221" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0" >left: OUTSIDE of the spine   |   right: INSIDE (dashed)</text><text x="100" y="145" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >SEWING (2 min)</text><text x="100" y="149.05" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >1  Tail A: outside -> in at H2.   2  Inside run up to H1, out.</text><text x="100" y="153.1" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >3  Outside, long stitch H1 -> H3 (passing H2), in at H3.</text><text x="100" y="157.15" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >4  Inside run up to H2, out: tail B. Both tails now leave H2 on the outside,</text><text x="100" y="161.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >    one each side of the long stitch.   5  Tie a half knot over the long stitch,</text><text x="100" y="165.25" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >    leave tails ~ 200 mm each. No knot inside the book.</text><text x="100" y="169.3" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >TABLE (guest, 20 s)</text><text x="100" y="173.35" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >6  Lay the book on the napkin roll, spine left; tails around the roll (and the book),</text><text x="100" y="177.4" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >    bow on the cover. The belt is the napkin ring; the book is its tag.</text><line x1="200" y1="219.4" x2="208" y2="219.4" class="cut" /><text x="210.5" y="220" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >outline / pierced holes</text><line x1="200" y1="224" x2="208" y2="224" class="mtn" /><text x="210.5" y="224.6" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >mountain crease (scored 0.4)</text><line x1="200" y1="228.6" x2="208" y2="228.6" class="val" /><text x="210.5" y="229.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >valley crease (inside)</text></svg>