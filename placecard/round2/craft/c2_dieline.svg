        </style></defs><rect x="0" y="0" width="330" height="250" fill="#ffffff"/><text x="10" y="13" font-size="5.2" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" >02  LANTERN LATTICE — kirigami cylinder that pops into a double barrel</text><text x="10" y="18.2" font-size="2.8" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >Dieline 1:1 (mm). One strip 194 x 78, 350 g lemon board, black print. Knife-cut slits (zero width), 32 mid-creases, slot and tongues.</text><rect x="18" y="40" width="194" height="78" rx="0" class="cut" fill="#feed95" /><rect x="18" y="62" width="10" height="48" rx="0" class="cut" fill="#ffffff" /><rect x="198" y="62" width="14" height="48" rx="0" class="cut" fill="#ffffff" /><rect x="198" y="40" width="14" height="3" rx="0" class="cut" fill="#ffffff" /><rect x="198" y="51" width="14" height="2" rx="0" class="cut" fill="#ffffff" /><rect x="198" y="61" width="14" height="1" rx="0" class="cut" fill="#ffffff" /><rect x="198" y="110" width="14" height="2" rx="0" class="cut" fill="#ffffff" /><rect x="198" y="116" width="14" height="2" rx="0" class="cut" fill="#ffffff" /><rect x="27.6" y="83" width="0.8" height="8" rx="0" class="cut" fill="#ffffff" /><rect x="27.6" y="93" width="0.8" height="8" rx="0" class="cut" fill="#ffffff" /><rect x="27.6" y="112" width="0.8" height="4" rx="0" class="cut" fill="#ffffff" /><line x1="38.625" y1="66" x2="38.625" y2="84" class="cut" /><line x1="49.25" y1="66" x2="49.25" y2="84" class="cut" /><line x1="59.875" y1="66" x2="59.875" y2="84" class="cut" /><line x1="70.5" y1="66" x2="70.5" y2="84" class="cut" /><line x1="81.125" y1="66" x2="81.125" y2="84" class="cut" /><line x1="91.75" y1="66" x2="91.75" y2="84" class="cut" /><line x1="102.375" y1="66" x2="102.375" y2="84" class="cut" /><line x1="113" y1="66" x2="113" y2="84" class="cut" /><line x1="123.625" y1="66" x2="123.625" y2="84" class="cut" /><line x1="134.25" y1="66" x2="134.25" y2="84" class="cut" /><line x1="1