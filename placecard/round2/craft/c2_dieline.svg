ight="700" fill="#111111" text-anchor="middle" letter-spacing="0" >Dinner</text><text x="102.375" y="58.6" font-size="3.6" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >10.10.2026</text><text x="144.875" y="48.4" font-size="8" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Sophia</text><text x="144.875" y="58" font-size="8" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0" >Zhuravkova</text><text x="187.375" y="49.6" font-size="2.9" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >Colorblock × DNA Kitchen</text><text x="187.375" y="54" font-size="2.9" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >Moscow</text><text x="187.375" y="58.4" font-size="2.9" font-weight="500" fill="#111111" text-anchor="middle" letter-spacing="0" >10 Oct 2026</text><line x1="18" y1="124" x2="212" y2="124" class="dim" /><text x="115" y="128" font-size="2.6" font-weight="400" fill="#111111" text-anchor="middle" letter-spacing="0" >194</text><line x1="217" y1="40" x2="217" y2="118" class="dim" /><text transform="translate(221 79) rotate(90)" font-size="2.6" fill="#111111" text-anchor="middle">78</text><line x1="28" y1="132" x2="198" y2="132" class="dim" /><text x="113" y="136" font-size="2.6" font-weight="400" fill="#111111" text-anchor="middle" letter-spacing="0" >ring 170 = 16 x 10.625</text><text x="199" y="37" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >tongues 14 x 8 (belt)</text><text x="19" y="37" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >slots 0.8 x 8 at x = 10</text><text x="19" y="84" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >notch: lattice</text><text x="19" y="87.5" font-size="2.2" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >ends butt</text><text x="18" y="168" font-size="3" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0" >Ribbon in flat and pressed states (side section, to scale)</text><line x1="36" y1="176" x2="36" y2="194" class="dim" /><text x="38" y="180" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >flat 18</text><polyline points="86,177.517 91,185 86,192.483" class="ink" fill="none"/><line x1="86" y1="176" x2="86" y2="194" class="thin" stroke-dasharray="1 1"/><text x="93" y="185" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >pressed: chord 14.97, bulge 5.0</text><text x="93" y="188.6" font-size="2.4" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0" >(each row loses 3.03 mm)</text><text x="18" y="202" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >ASSEMBLY (30 s)</text><text x="18" y="206.05" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >1  Roll the strip with the print outside; pass the two belt tongues through the slots from the outside and fold them flat inside;</text><text x="18" y="210.1" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >    the 4 mm foot tongue the same way. Ring = 170 mm = 54 mm diameter.</text><text x="18" y="214.15" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >2  Stand it on the table and press the belt down 7 mm: the 32 pre-creased ribbons kink and bulge outward; the staggered rows interlock into a lattice.</text><text x="18" y="218.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >3  Optional: LED tealight inside; light leaks through the lattice, the belt stays dark-printed and reads front and back.</text><line x1="190" y1="167.4" x2="198" y2="167.4" class="cut" /><text x="200.5" y="168" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >knife cut / outline (zero-width slits; slots 0.8)</text><line x1="190" y1="172" x2="198" y2="172" class="mtn" /><text x="200.5" y="172.6" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >mountain crease (score from print side, so crease bulges out)</text><line x1="190" y1="176.6" x2="198" y2="176.6" class="thin" /><text x="200.5" y="177.2" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >bridge-band guide (no score)</text><rect x="190" y="179.6" width="8" height="3.2" rx="0" class="thin" fill="#feed95" /><text x="200.5" y="181.8" font-size="2.7" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" >350 g lemon board, print black, one side</text></svg>